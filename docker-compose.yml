services:
  uzbektraveler-front:
    container_name: uzbektraveler-front
    build:
      context: /var/www/uzbektraveler/front
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=https://admin.uzbektraveler.com/api
      - NEXT_TELEMETRY_DISABLED=1